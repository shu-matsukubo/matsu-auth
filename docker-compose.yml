services:
  auth:
    build:
      context: .
    container_name: matsu-auth
    ports:
      - 18081:8080
    environment:
      - AUTH_PORT=8080
      - AUTH_DATABASE_URL=postgres://matsu-auth:matsu-auth-pass@auth-db:5432/matsu-auth
      - AUTH_ISSUER=http://localhost:18081
      - AUTH_AUDIENCE=matsu-api
      - AUTH_ACCESS_TOKEN_TTL_SECONDS=900
      - AUTH_REFRESH_TOKEN_TTL_SECONDS=2592000
      - AUTH_PRIVATE_KEY_PATH=/app/keys/private.pem
      - AUTH_JWKS_PATH=/app/keys/jwks.json
      - AUTH_KEY_ID=matsu-dev-key-1
      - AUTH_ALLOWED_ORIGIN=http://localhost:5173
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      - auth-db

  auth-db:
    image: postgres:16-alpine
    container_name: matsu-auth-db
    ports:
      - 15432:5432
    environment:
      - POSTGRES_DB=matsu-auth
      - POSTGRES_USER=matsu-auth
      - POSTGRES_PASSWORD=matsu-auth-pass
      - TZ=Asia/Tokyo
    volumes:
      - auth_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  auth_db_data:
